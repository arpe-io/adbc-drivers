name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        # -S warning: report/fail on warnings and errors (the benign SC2317 info
        # on the test-source guard is intentional and does not fail the build).
        run: shellcheck -S warning -s sh install.sh tests/test_install.sh tests/check_releases.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer (install.ps1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path ./install.ps1 -Settings ./.github/PSScriptAnalyzerSettings.psd1
          if ($r) {
            $r | Format-Table RuleName, Severity, Line, Message -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($r.Count) issue(s)."
          }
          Write-Host "PSScriptAnalyzer: clean."

  # The tests run without network access: the GitHub API and the downloads are
  # replaced by functions (see tests/).
  test-sh:
    name: tests (install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dash
        run: dash tests/test_install.sh
      - name: bash --posix
        run: bash --posix tests/test_install.sh
      - name: busybox sh
        run: |
          command -v busybox >/dev/null || sudo apt-get install -y -q busybox
          busybox sh tests/test_install.sh

  test-ps:
    name: tests (install.ps1, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows PowerShell 5.1", os: windows-latest, shell: powershell }
          - { name: "PowerShell 7 on Windows", os: windows-latest, shell: pwsh }
          - { name: "PowerShell 7 on Linux", os: ubuntu-latest, shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          ./tests/test_install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  registry:
    name: driver list in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: registry.json, install.sh, install.ps1 and README agree
        shell: pwsh
        run: |
          ./tests/test_registry.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
