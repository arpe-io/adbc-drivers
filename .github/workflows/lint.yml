name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        # -S warning: report/fail on warnings and errors (the benign SC2317 info
        # on the test-source guard is intentional and does not fail the build).
        run: shellcheck -S warning -s sh install.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer (install.ps1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path ./install.ps1 -Settings ./.github/PSScriptAnalyzerSettings.psd1
          if ($r) {
            $r | Format-Table RuleName, Severity, Line, Message -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($r.Count) issue(s)."
          }
          Write-Host "PSScriptAnalyzer: clean."
